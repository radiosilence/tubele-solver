[package]
name = "tubele-solver"
version = "0.1.0"
edition = "2024"
description = "Solves Tubele, the daily London station guessing game, by guessing and elimination on the TfL network"
license = "MIT"
repository = "https://github.com/radiosilence/tubele-solver"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
headless_chrome = "1.0.22"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }
