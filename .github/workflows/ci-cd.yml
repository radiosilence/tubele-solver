name: CI/CD

# CI checks and builds every change. CD runs on main when Cargo.toml carries a
# version that has no GitHub release yet: it publishes the release with the
# binaries CI built, then rewrites the formula in radiosilence/homebrew-tap.
# A manual run on main retries a failed release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push cancels a pull request's older run. Runs on main are never
# cancelled, since one of them may be releasing.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this run releases. Only a 404 for the tag means the version is not
  # out; any other failure stops the run rather than guessing.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$EVENT" != pull_request ]; then
            if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
              if printf '%s' "$out" | grep -q 'HTTP 404'; then
                release=true
              else
                echo "::error::cannot tell whether v$version is released: $out"
                exit 1
              fi
            fi
          fi
          printf 'version=%s\nrelease=%s\n' "$version" "$release" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: lint
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Offline tests only; the ignored ones play the live game.
      - run: cargo test --locked

  # Static Linux binaries on every change; they are what a release attaches.
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Tarred, because an artifact does not keep the executable bit. The
      # unpacked binary is run so a broken package fails here.
      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/tubele-solver-${{ matrix.name }}.tar.gz" -C target/${{ matrix.target }}/release tubele-solver
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$GITHUB_WORKSPACE/tubele-solver-${{ matrix.name }}.tar.gz" -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/tubele-solver" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tubele-solver-${{ matrix.name }}
          path: tubele-solver-${{ matrix.name }}.tar.gz
          retention-days: ${{ needs.changes.outputs.release == 'true' && 90 || 7 }}

  # Built on every change, since macOS is the main platform. A release binary
  # is Developer ID signed and notarised; the notarise action fails when a
  # signing secret is missing, so a release never ships an unsigned binary.
  build-macos:
    name: Build macos-arm64
    runs-on: macos-latest
    needs: changes
    timeout-minutes: 30
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: macos
      - run: cargo build --release --locked --target "$TARGET"
      - name: Sign and notarise
        if: needs.changes.outputs.release == 'true'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/aarch64-apple-darwin/release/tubele-solver
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/tubele-solver-macos-arm64.tar.gz" -C "target/$TARGET/release" tubele-solver
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$GITHUB_WORKSPACE/tubele-solver-macos-arm64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/tubele-solver" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tubele-solver-macos-arm64
          path: tubele-solver-macos-arm64.tar.gz
          retention-days: ${{ needs.changes.outputs.release == 'true' && 90 || 7 }}

  # The one status for branch protection to require.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, build-linux, build-macos]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # Creates the tag through the API on the commit that was built.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: tubele-solver-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.changes.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*.tar.gz

  # After the release, so the formula never names a tarball that does not
  # exist. Skips without RELEASE_TOKEN, a token that can push to the tap.
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: tubele-solver-*
      - name: Write the formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::RELEASE_TOKEN is not set; skipping the Homebrew tap"
            exit 0
          fi
          ARTIFACTS="$PWD/artifacts"
          sha() {
            local f
            f=$(find "$ARTIFACTS" -type f -name "tubele-solver-$1.tar.gz" | head -1)
            [ -n "$f" ] || { echo "missing tubele-solver-$1.tar.gz" >&2; exit 1; }
            sha256sum "$f" | awk '{print $1}'
          }
          MAC_ARM=$(sha macos-arm64)
          LIN_ARM=$(sha linux-arm64); LIN_X86=$(sha linux-x86_64)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          BASE="https://github.com/radiosilence/tubele-solver/releases/download/v${VERSION}"
          cat > Formula/tubele-solver.rb <<FORMULA
          class TubeleSolver < Formula
            desc "Solve Tubele, the London station guessing game, by elimination"
            homepage "https://github.com/radiosilence/tubele-solver"
            version "${VERSION}"
            license "MIT"
            on_macos do
              depends_on arch: :arm64
              url "${BASE}/tubele-solver-macos-arm64.tar.gz"
              sha256 "${MAC_ARM}"
            end
            on_linux do
              on_arm do
                url "${BASE}/tubele-solver-linux-arm64.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "${BASE}/tubele-solver-linux-x86_64.tar.gz"
                sha256 "${LIN_X86}"
              end
            end
            def install
              bin.install "tubele-solver"
              generate_completions_from_executable(bin/"tubele-solver", "--completions")
            end
            def caveats
              "Playing the live game needs a Chromium-based browser (Chrome, Brave, Edge, Helium); set TUBELE_BROWSER to use another."
            end
            test do
              assert_match "tubele-solver", shell_output("#{bin}/tubele-solver --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/tubele-solver.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tubele-solver.rb
          if git diff --cached --quiet; then
            echo "formula already at ${VERSION}"
            exit 0
          fi
          git commit -m "tubele-solver ${VERSION}"
          git push
